name: Deploy Bole Music Shop

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Bole Music Shop
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./day23/bole-music-shop

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
