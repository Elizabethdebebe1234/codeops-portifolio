<!-- Fixed 1: Using a real button makes it work with the keyboard and lets screen readers know it is a button. -->
<button>Submit</button>

<br /><br />

<!-- Fixed 2: Adding a label tells screen readers what the input is for. -->
<label for="name">Full Name:</label>
<input type="text" id="name" />

<br /><br />

<!-- Fixed 3: The alt text describes the image for screen readers and if the image cannot load. -->
<img src="injera.jpg" alt="A plate of traditional Ethiopian injera with wot" />
