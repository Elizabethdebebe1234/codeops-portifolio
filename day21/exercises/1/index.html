<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Country Facts</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <button id="themeBtn">Dark Mode</button>
    <main class="container">
      <h1>Country Facts</h1>

      <p>Search for a country to see some facts about it.</p>

      <form id="searchForm">
        <input
          type="text"
          id="countryInput"
          placeholder="Enter country name"
          value="Ethiopia"
          required
        />

        <button type="submit">Search</button>
      </form>

      <section id="facts" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
